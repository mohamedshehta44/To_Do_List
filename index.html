<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <meta
      name="description"
      content="A simple and responsive To-Do List application that helps users add, manage, complete, and delete daily tasks. The project provides a clean and user-friendly interface for organizing tasks efficiently."
    />
    <meta
      name="keywords"
      content="To-Do List, Task Management , CRUD, Add Tasks,  Delete Tasks, Complete Tasks"
    />
    <link rel="stylesheet" href="CSS/all.min.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="JS/master.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div id="header">
        <div class="box">
          <h1>todo list</h1>
          <p>organize your tasks, stay focused, and get things done.</p>
        </div>
        <div class="date"></div>
      </div>

      <div id="textfield">
        <div>
          <i class="fa-solid fa-list"></i>
          <input type="text" placeholder="enter a new task..." />
        </div>
        <button class="add">+ add task</button>
        <button  type="button" id="delete-all"> delete all</button>
      </div>
   

      <div class="message"></div>





      <div id="statistics">
        <div>
          <div>
            <h3>total tasks</h3>
            <p><span id="totalCount"></span> items</p>
          </div>
          <i class="fa-solid fa-list-check"></i>
        </div>

        <div>
          <div>
            <h3>completed</h3>
            <p><span id="completedCount"></span> items</p>
          </div>
          <i class="fa-solid fa-check"></i>
        </div>

        <div>
          <div>
            <h3>remaining</h3>
            <p><span id="count"></span> items</p>
          </div>
          <i class="fa-light fa-clock"></i>
        </div>
      </div>

      <div class="tasks">
        <div class="title">
          <h2>my tasks</h2>
          <p>keep track of your daily tasks.</p>
        </div>
        <div class="sort-tasks">
          <button class="tab active" data-filter="all">all</button>

          <button class="tab" data-filter="completed">completed</button>

          <button class="tab" data-filter="remaining">remaining</button>

          <div id="taskList"></div>
        </div>
      </div>
    </div>
  </body>
</html>
