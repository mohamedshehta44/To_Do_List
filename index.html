<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <meta
      name="description"
      content="A simple and responsive To-Do List application that helps users add, manage, complete, and delete daily tasks. The project provides a clean and user-friendly interface for organizing tasks efficiently."
    />
    <meta
      name="keywords"
      content="To-Do List, Task Management , CRUD, Add Tasks,  Delete Tasks, Complete Tasks"
    />
    <link rel="stylesheet" href="CSS/all.min.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="JS/master.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div id="header">
        <div class="box">
          <h1>to-do list</h1>
          <p>organize your tasks, stay focused, and get things done.</p>
        </div>
        <div class="date"><i class="fa-regular fa-calendar"></i></div>
      </div>

      <form action="" id="textfield">
        <input type="text" placeholder="enter a new task..." required />
        <button class="add">+ add task</button>
      </form>
      <div id="statistics">
        <div class="box">
          <div>
            <h3>total tasks</h3>
            <p><span class="totalCount"></span> items</p>
          </div>
          <i class="fa-solid fa-list-check"></i>
        </div>
        <div class="box">
          <div>
            <h3>completed</h3>
            <p><span class="completedCount"></span> items</p>
          </div>
          <i class="fa-solid fa-check"></i>
        </div>

        <div class="box">
          <div>
            <h3>remaining</h3>
            <p><span class="remainingCount"></span> items</p>
          </div>
          <i class="fa-regular fa-clock"></i>
        </div>
      </div>

      <div id="tasks">
        <div class="title">
          <h2>my tasks</h2>
          <p>keep track of your daily tasks.</p>
        </div>
        <div class="sort-tasks">
          <div class="containerBTN">
            <button class="tab active" data-filter="all">all</button>

            <button class="tab" data-filter="completed">completed</button>

            <button class="tab" data-filter="remaining">remaining</button>
          </div>
          <div id="taskList"></div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
